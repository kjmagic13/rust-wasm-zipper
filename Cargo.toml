[package]
name = "rust-wasm-zipper"
version = "0.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Blob",
    "File",
    "FileSystemFileHandle",
    "ReadableStream",
    "Response",
] }
wasm-streams = "0.6"
futures = "0.3"
crc32fast = "1"